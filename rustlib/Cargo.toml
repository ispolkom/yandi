[workspace]
resolver = "2"
members = ["yandi_rs", "yandi_llm", "yandi_state", "yandi_db", "yandi_core"]

# Отдельное Rust-рабочее пространство для переноса Python-логики (agent/, pet/) на Rust,
# кусок за куском — по договорённости с владельцем: маленькими шагами, без спешки, никогда
# не ломая текущее поведение. Не путать с ../node/ (это отдельный workspace — сетевой узел,
# супервизор, ключи; исторически самостоятельный проект). Здесь — только то, что раньше было
# на Python и переехало на Rust ради надёжности/скорости, вызывается ИЗ Python как обычный
# нативный модуль (через PyO3), пока Python-версия функции остаётся рядом и живой.
#
# Правило на каждый перенесённый кусок (см. yandi_rs/README.md):
#   1. Зафиксировать нынешнее поведение тестами (старыми или новыми).
#   2. Написать Rust-версию.
#   3. Доказать построчное совпадение на тех же примерах (contract/parity-тест).
#   4. Только тогда переключать вызывающий код — и держать Python-версию рядом, не удалять.
