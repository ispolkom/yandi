[package]
name = "yandi_rs"
version = "0.1.0"
edition = "2021"
description = "Rust-переносы отдельных модулей YANDI (agent/, pet/), вызываемые из Python через PyO3. Каждый перенесённый Python-модуль получает свой подмодуль здесь того же имени — см. ../README.md."
license = "MIT"

[lib]
name = "yandi_rs"
# cdylib — то, что грузит Python (import yandi_rs); rlib — чтобы `cargo test` мог гонять
# юнит-тесты обычным образом, без сборки через maturin.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
regex = "1.10"
once_cell = "1.19"
rand = "0.8"
base64 = "0.22"
unicode-normalization = "0.1"
caseless = "0.2"
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
